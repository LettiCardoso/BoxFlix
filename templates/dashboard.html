<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BoxFlix</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}" />
</head>
<body class="home-body">

  <header class="home-topbar">
    <div class="home-topbar__inner">
      <a class="logo" href="{{ url_for('dashboard') }}">BoxFlix</a>

      <nav class="home-nav">
        <a href="#inicio" class="home-nav__link home-nav__link--active" data-view="inicio">Início</a>
        <a href="#filmes" class="home-nav__link" data-view="filmes">Filmes</a>
        <a href="#series" class="home-nav__link" data-view="series">Séries</a>
        <a href="#minha-lista" class="home-nav__link" data-view="minha-lista">Minha Lista</a>
      </nav>

      <div class="home-topbar__actions">
        <form class="home-search" action="{{ url_for('busca_avancada') }}" method="get">
          <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" name="q" placeholder="Buscar...">
        </form>
        <button class="home-icon-btn" aria-label="Notificações">
          <svg viewBox="0 0 24 24" class="icon"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <div class="home-user">
          <div class="home-avatar" title="{{ nome }}">{{ nome[0]|upper if nome else '?' }}</div>
          <a href="{{ url_for('logout') }}" class="home-sair">Sair</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO / DESTAQUE -->
    <section class="hero" id="hero">
      <div class="hero__bg" id="hero-bg"></div>
      <div class="hero__scrim"></div>

      <div class="hero__content">
        <div class="hero__meta">
          <span class="badge" id="hero-tipo">FILME</span>
          <span class="hero__tag" id="hero-tag">Destaque da Semana</span>
        </div>

        <h1 class="hero__title" id="hero-titulo">Carregando…</h1>
        <p class="hero__desc" id="hero-desc"></p>

        <div class="hero__actions">
          <button class="btn btn--primary">
            <svg viewBox="0 0 24 24" class="icon icon--sm"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            Assistir
          </button>
          <button class="btn btn--ghost" id="hero-mais-info">
            <svg viewBox="0 0 24 24" class="icon icon--sm"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="8"/><line x1="12" y1="12" x2="12" y2="16"/></svg>
            Mais Informações
          </button>
          <button class="btn btn--ghost" id="hero-lista" type="button"></button>
        </div>
      </div>

      <!-- controles do carrossel (preenchidos pelo home.js) -->
      <div class="hero__nav" id="hero-nav" hidden>
        <button class="hero__seta" id="hero-prev" type="button" aria-label="Anterior">
          <svg viewBox="0 0 24 24" class="icon icon--sm"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="hero__dots" id="hero-dots"></div>
        <button class="hero__seta" id="hero-next" type="button" aria-label="Próximo">
          <svg viewBox="0 0 24 24" class="icon icon--sm"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </section>

    <!-- POPULARES AGORA -->
    <section class="row" id="row-populares">
      <h2 class="row__title">Populares agora</h2>
      <div class="grid" id="grid-populares"></div>
    </section>

    <!-- SÉRIES EM ALTA -->
    <section class="row" id="row-series">
      <h2 class="row__title">Séries em Alta</h2>
      <div class="grid" id="grid-series"></div>
    </section>

    <!-- FILMES / SÉRIES / MINHA LISTA (uma view por vez, escolhida pelo menu) -->
    <section class="row" id="view-catalogo" hidden>
      <h2 class="row__title" id="catalogo-titulo"></h2>
      <div class="grid" id="grid-catalogo"></div>
      <p class="row__vazio" id="catalogo-vazio" hidden></p>
    </section>
  </main>

  <footer class="home-footer">
    <div class="home-footer__inner">
      <a class="logo" href="{{ url_for('dashboard') }}">BoxFlix</a>
      <nav class="home-footer__links">
        <a href="#">Termos de Uso</a>
        <a href="#">Privacidade</a>
        <a href="#">Ajuda</a>
        <a href="#">Contato</a>
      </nav>
      <p class="home-footer__copy">&copy; 2026 BoxFlix. Projeto acadêmico — todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Modal de detalhes (filme/série) -->
  <div class="modal" id="modal-detalhe">
    <div class="modal__caixa">
      <button class="modal__fechar" id="modal-fechar" aria-label="Fechar">&times;</button>
      <div class="modal__poster" id="modal-poster"></div>
      <div class="modal__conteudo">
        <span class="badge" id="modal-tipo">FILME</span>
        <h2 class="modal__titulo" id="modal-titulo"></h2>
        <p class="modal__meta" id="modal-meta"></p>
        <p class="modal__descricao" id="modal-descricao"></p>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
  <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
