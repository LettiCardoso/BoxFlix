name: CI/CD - Test, Build, Push and Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  IMAGE_NAME: boxflix

jobs:
  test:
    name: Testes automatizados (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes
        run: pytest -v

  docker:
    name: Build e publicação da imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: test                       # só publica se os testes passarem
    if: github.event_name == 'push'   # não publica em pull request
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy contínuo (CD) no Render
    runs-on: ubuntu-latest
    needs: docker                     # só faz deploy se os testes e o push Docker passarem
    if: github.event_name == 'push'
    steps:
      - name: Disparar deploy no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Secret RENDER_DEPLOY_HOOK não configurado."
            exit 1
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"